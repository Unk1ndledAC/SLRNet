org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Only needed if your installed platform level differs from compileSdk (36 here)
# and AGP complains. The code does not use any API above 34.
android.suppressUnsupportedCompileSdk=36

# If Gradle picks up a JDK older than 17 (AGP 8 requires 17), point it at a full
# JDK 17 here, or export JAVA_HOME before running ./gradlew:
# org.gradle.java.home=/absolute/path/to/jdk-17
